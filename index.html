<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My name is Megumin</title>
    <link rel="stylesheet" href="index.css">

    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Responsive Navigation Bar */
        .nav-container {
            display: flex; 
            flex-wrap: wrap; /* Allows menu to wrap on small screens */
            align-items: center; 
            justify-content: space-between;
            background-color: rgb(255, 255, 255);
            padding: 10px 20px;
        }

        .nav-links {
            display: flex; 
            padding: 10px 0; 
            color: rgb(0, 0, 0); 
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-container {
            display: flex;
            align-items: center;
            margin-left: auto;
            padding: 10px 0;
        }

        @media (max-width: 600px) {
            .nav-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-container {
                margin-left: 0;
                width: 100%;
            }
            .search-input {
                width: 100% !important;
            }
        }

        .search-input {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            background-color: #f9f9f9;
            color: #333;
            width: 180px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #3f4d9b;
            background-color: #fff;
            width: 220px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Responsive Hero Section (Text + Video) */
        .hero-section {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            flex-wrap: wrap; /* Pushes video underneath text on mobile */
            gap: 20px;
            box-sizing: border-box;
            padding: 25px;
        }

        .hero-text {
            flex: 1;
            min-width: 280px;
        }

        /* Responsive Video Container */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            flex: 1;
            min-width: 300px;
            max-width: 560px;
            width: 100%;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .video-wrapper {
                max-width: 100%;
            }
        }

        /* Gallery and Hover FX Setup */
        .image-gallery {
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin: 20px;
            align-items: center;
        }

        .megumin {
            display: flex; 
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px; /* Limits size on desktop */
            overflow: visible; /* Allows the scaled image to pop out */
        }

        .megumin img {
            width: 100%; /* Makes image scale perfectly to container width */
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        /* Tamed scale down to 110% so it doesn't break mobile boundaries */
        .megumin:hover img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
